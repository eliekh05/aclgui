name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build ${{ matrix.bin_name }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS
          - runner: macos-latest
            target: aarch64-apple-darwin
            bin_name: aclgui-darwin-arm64

          - runner: macos-latest
            target: x86_64-apple-darwin
            bin_name: aclgui-darwin-x64

          # Linux
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: aclgui-linux-x64

          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            bin_name: aclgui-linux-arm64

          # Windows
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: aclgui-win32-x64.exe

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libgtk-3-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libspeechd-dev libxkbcommon-dev libssl-dev \
            gcc-aarch64-linux-gnu \
            libgtk-3-dev:arm64 \
            libxcb-render0-dev:arm64 libxcb-shape0-dev:arm64 libxcb-xfixes0-dev:arm64 \
            libspeechd-dev:arm64 libxkbcommon-dev:arm64 libssl-dev:arm64

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG_PATH_aarch64_unknown_linux_gnu: /usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig

      - name: Package binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/aclgui ${{ matrix.bin_name }}

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item target/${{ matrix.target }}/release/aclgui.exe ${{ matrix.bin_name }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.bin_name }}
          path: ${{ matrix.bin_name }}
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/binaries
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/binaries/*
          generate_release_notes: true

  publish-npm:
    name: Publish npm Packages
    needs: create-release
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/binaries
          merge-multiple: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Determine package version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Generate npm packages
        run: |
          node scripts/npm-stamp.mjs \
            --version=${{ steps.version.outputs.version }} \
            --binaries=dist/binaries \
            --out=dist/npm

      - name: Publish platform packages
        run: |
          for dir in \
            dist/npm/darwin-arm64 \
            dist/npm/darwin-x64 \
            dist/npm/linux-x64 \
            dist/npm/linux-arm64 \
            dist/npm/win32-x64; do
            [ -d "$dir" ] && npm publish "$dir" --access=public
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish metapackage
        run: npm publish dist/npm/aclgui --access=public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
