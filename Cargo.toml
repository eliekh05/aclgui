[workspace]
members = [".", "crates/acl-core"]
resolver = "2"

[package]
name = "aclgui"
version = "1.0.0"
edition = "2024"
description = "Cross-platform ACL & permissions GUI with OS detection, staged changes, and interactive help"
license = "MIT"
repository = "https://github.com/eliekh05/aclgui"

[[bin]]
name = "aclgui"
path = "src/main.rs"

[dependencies]
acl-core = { path = "crates/acl-core" }
eframe = { version = "0.36", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.36"
egui_extras = { version = "0.36", features = ["all_loaders"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
